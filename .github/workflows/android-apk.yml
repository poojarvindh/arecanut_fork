name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend API base URL to build against (VITE_API_BASE)"
        required: false
        default: "https://arecanut.orangebeach-de98094e.centralindia.azurecontainerapps.io/api"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_API_BASE: ${{ inputs.api_base }}
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*') }}

      - name: Decode release keystore
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write keystore.properties
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore from runner
        if: always()
        working-directory: frontend/android
        run: rm -f release.keystore keystore.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arecanut-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
